name: Ping antes de la jornada
# Despierta Render (Free se duerme a los 15 min) y deja actividad diaria en Supabase
# (/v1/health hace select 1), que evita la pausa tras 1 semana sin uso.
# 10:50 UTC = 07:50 en horario de verano de Chile (UTC-3) y 06:50 en invierno (UTC-4).
on:
  schedule:
    - cron: '50 10 * * 1-6'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      API_URL: https://reparto-back.onrender.com
    steps:
      - name: Despertar y verificar /v1/health
        run: |
          start=$(date +%s)
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' --max-time 70 "$API_URL/v1/health" || true)
            echo "intento $i: HTTP $code"
            if [ "$code" = "200" ]; then
              secs=$(( $(date +%s) - start ))
              echo "### Ping OK en ${secs}s" >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/h.json >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "### Ping FALLÓ (último HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
