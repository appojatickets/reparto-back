name: Respaldo diario
# Copia cifrada de la base (esquema public). El repo es público: el artefacto
# también lo sería, por eso solo se sube cifrado (ADR 0044).
on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC, antes de la jornada
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: respaldo
  cancel-in-progress: false
jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verificar que los secretos existen
        id: config
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Faltan los secretos BACKUP_DATABASE_URL y/o BACKUP_PASSPHRASE; no se hizo respaldo. Ver docs/respaldo.md"
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$BACKUP_PASSPHRASE"
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar cliente de PostgreSQL 17
        if: steps.config.outputs.listo == 'si'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Volcar y cifrar
        if: steps.config.outputs.listo == 'si'
        run: |
          set -euo pipefail
          umask 077
          fecha="$(date -u +%Y-%m-%d)"
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" \
            --schema=public --format=custom --no-owner --no-privileges \
            --file="respaldo-$fecha.dump"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "respaldo-$fecha.dump.gpg" "respaldo-$fecha.dump"
          rm -f "respaldo-$fecha.dump"
          ls -l "respaldo-$fecha.dump.gpg"
          echo "fecha=$fecha" >> "$GITHUB_ENV"
      - name: Subir el respaldo cifrado
        if: steps.config.outputs.listo == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ env.fecha }}
          path: respaldo-${{ env.fecha }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
